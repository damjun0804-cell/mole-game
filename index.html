<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="widh=device-width, initial-scale=1.0">
	<title>윤 잡기 게임</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="gmae-container">
		<h1>윤 잡기 게임</h1>
		<div class="score-board">
			<span>점수 : <strong id="score">0</strong></span>
			<span>남은시간 : <strong id="time-left">10</strong>초</span>
		</div>

		<button id='start-btn' onclick="startGame()">게임시작</button>

		<div class="grid">
			<div class="hole" id="hole-0"></div>
			<div class="hole" id="hole-1"></div>
			<div class="hole" id="hole-2"></div>
			<div class="hole" id="hole-3"></div>
			<div class="hole" id="hole-4"></div>
			<div class="hole" id="hole-5"></div>
			<div class="hole" id="hole-6"></div>
			<div class="hole" id="hole-7"></div>
			<div class="hole" id="hole-8"></div>	
		</div>
	</div>

	<script type="script.js"></script>
</body>
</html>
